    - generic [ref=f16e218]:
      - generic [ref=f16e219]: How we operate
      - heading "From RFP to POD on a single accountability chain." [level=2] [ref=f16e220]
      - paragraph [ref=f16e221]: One operator, one ops desk, four steps. The whole load lives on a single transaction — no second-tier brokers, no double-dispatched confusion, no calls about who actually has your trailer.
    - generic [ref=f16e222]:
      - generic [ref=f16e223]:
        - generic [ref=f16e224]: "01"
        - heading "Quote" [level=4] [ref=f16e225]
        - paragraph [ref=f16e226]: Share lane, equipment, weight, and pickup window — our ops desk quotes it directly, no broker markup.
      - generic [ref=f16e227]:
        - generic [ref=f16e228]: "02"
        - heading "Dispatch" [level=4] [ref=f16e229]
        - paragraph [ref=f16e230]: We assign owned equipment or a vetted partner fleet and you get the driver and truck before pickup.
      - generic [ref=f16e231]:
        - generic [ref=f16e232]: "03"
        - heading "Track + POD" [level=4] [ref=f16e233]
        - paragraph [ref=f16e234]: GPS tracking and signed PODs delivered electronically — one ops contact end to end.
