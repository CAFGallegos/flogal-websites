      - generic [ref=f10e205]: How we operate
      - heading "From RFP to POD on a single accountability chain." [level=2] [ref=f10e206]
      - paragraph [ref=f10e207]: One operator, one ops desk, four steps. The whole load lives on a single transaction — no second-tier brokers, no double-dispatched confusion, no calls about who actually has your trailer.
