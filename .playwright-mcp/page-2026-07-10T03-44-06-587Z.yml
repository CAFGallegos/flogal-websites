  - generic [ref=f11e56]:
    - generic [ref=f11e57]: Why an operator buys differently
    - heading "We site property against freight reality, not listing photos." [level=2] [ref=f11e58]
    - paragraph [ref=f11e59]: Our own dispatch desk knows which corridors have carrier density, fuel access, and driver depth — because our trucks run them. When we buy a yard, it's because freight already moves there.
  - generic [ref=f11e61]:
    - generic [ref=f11e62]:
      - generic [ref=f11e63]: How we operate
      - heading "Industrial real estate, run like an operating company." [level=2] [ref=f11e64]
    - generic [ref=f11e65]:
      - generic [ref=f11e66]:
        - text: "01"
        - heading "Lane density model" [level=4] [ref=f11e67]
        - paragraph [ref=f11e68]: We evaluate every site against carrier lane data — where freight already moves, not where the parcel happened to come up.
      - generic [ref=f11e69]:
        - text: "02"
        - heading "Site & spec" [level=4] [ref=f11e70]
        - paragraph [ref=f11e71]: "We buy and improve to a freight-grade spec: hardened surfaces, security, fuel access."
      - generic [ref=f11e72]:
        - text: "03"
        - heading "Lease or share" [level=4] [ref=f11e73]
        - paragraph [ref=f11e74]: Full-site leases for anchor tenants, or shared-yard arrangements for fleets that need stalls without an acquisition.
      - generic [ref=f11e75]:
        - text: "04"
        - heading "Ops handoff" [level=4] [ref=f11e76]
        - paragraph [ref=f11e77]: Sites plug into the Flogal carrier network from day one — fuel, drivers, and dispatch in the corridor.
  - generic [ref=f11e79]:
