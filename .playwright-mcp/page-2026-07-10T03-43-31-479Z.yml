  - generic [ref=f4e46]:
    - generic [ref=f4e47]:
      - generic [ref=f4e48]: Why direct
      - heading "Three things every shipper actually wants from a carrier." [level=2] [ref=f4e49]
      - paragraph [ref=f4e50]: Most freight today rides on margins, not on trucks. Flogal Carriers runs the opposite model — owned fleets, vetted partners, and the shortest possible distance between you and the driver.
    - generic [ref=f4e51]:
      - generic [ref=f4e52]:
        - heading "Direct capacity" [level=3] [ref=f4e57]
        - paragraph [ref=f4e58]: Your freight rides on Flogal-operated equipment or vetted partner fleets we dispatch ourselves. No load posting boards, no double-brokered surprises.
      - generic [ref=f4e59]:
        - heading "Vetted partners" [level=3] [ref=f4e64]
        - paragraph [ref=f4e65]: "Every partner fleet passes a 22-point compliance check: DOT authority, insurance verification, equipment age, and driver tenure. Re-checked quarterly."
      - generic [ref=f4e66]:
        - heading "No brokers" [level=3] [ref=f4e72]
        - paragraph [ref=f4e73]: One contract, one truck, one accountability chain. You talk to the operator dispatching your load — not a sales desk passing it down the chain for a margin.
  - generic [ref=f4e75]:
    - generic [ref=f4e76]:
