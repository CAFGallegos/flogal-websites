      - generic [ref=f4e219]: How we operate
      - heading "From RFP to POD on a single accountability chain." [level=2] [ref=f4e220]
      - paragraph [ref=f4e221]: One operator, one ops desk, four steps. The whole load lives on a single transaction — no second-tier brokers, no double-dispatched confusion, no calls about who actually has your trailer.
