      - generic [ref=f1e25]: Flogal Holdings
      - heading "One platform. Freight-native operating companies." [level=1] [ref=f1e26]: One platform.Freight-native operating companies.
      - paragraph [ref=f1e27]: Flogal Holdings is a privately held, operator-funded freight platform operating across hauling, equipment, and industrial real estate — built for durable, asset-backed growth.
      - generic [ref=f1e28]: Scroll to explore
  - generic [ref=f1e31]:
    - generic [ref=f1e32]:
      - generic [ref=f1e33]: Who We Are
      - heading "A logistics platform built from the ground up." [level=2] [ref=f1e34]
    - generic [ref=f1e35]:
      - paragraph [ref=f1e36]: Flogal Holdings is the parent of a group of operating businesses built around freight, physical assets, and long-term value. We're not a startup and not a broker — we're operators who own assets and run real freight companies.
      - generic [ref=f1e37]: "\"We build companies the way infrastructure should be built — documented, structured, and designed to outlast the people who started them.\""
      - paragraph [ref=f1e38]: Every entity operates with its own leadership and market, but shares one operating system and one standard of discipline. Our aim is to be the kind of operator banks want to lend to, insurers want to underwrite, and partners want to depend on.
