  - generic [ref=f1e77]:
    - generic [ref=f1e78]:
      - generic [ref=f1e79]:
        - generic [ref=f1e80]: Operating Thesis
        - heading "Why we build this way." [level=2] [ref=f1e81]: Why we buildthis way.
      - paragraph [ref=f1e82]: The freight and logistics industry is fragmented, undercapitalized, and poorly structured at the ownership level. Flogal is being built to be the exception — a multi-entity platform that operates like an institution from day one.
    - generic [ref=f1e83]:
      - generic [ref=f1e84]:
        - generic [ref=f1e85]: "01"
        - generic [ref=f1e86]: Institutional Structure First
        - generic [ref=f1e87]: Every entity is formed, documented, and capitalized to meet the standards of banks, insurers, and corporate partners. Not after we grow — from the start.
      - generic [ref=f1e88]:
        - generic [ref=f1e89]: "02"
        - generic [ref=f1e90]: Vertical Integration Creates Leverage
        - generic [ref=f1e91]: When you own the truck, the equipment, the yard, and the financing — you control margin at every level. That's the Flogal model.
      - generic [ref=f1e92]:
        - generic [ref=f1e93]: "03"
        - generic [ref=f1e94]: Assets Over Revenue
        - generic [ref=f1e95]: We build asset-backed businesses, not revenue-dependent service companies. Physical assets create permanence, collateral, and compounding value.
      - generic [ref=f1e96]:
        - generic [ref=f1e97]: "04"
        - generic [ref=f1e98]: Operators, Not Consultants
        - generic [ref=f1e99]: We make money by moving freight, selling equipment, and owning assets — not advisory or management fees.
      - generic [ref=f1e100]:
        - generic [ref=f1e101]: "05"
        - generic [ref=f1e102]: Scalable by Design
        - generic [ref=f1e103]: The holding structure is built to absorb new entities without restructuring. We can add a business the way you add a division — cleanly.
      - generic [ref=f1e104]:
        - generic [ref=f1e105]: "06"
        - generic [ref=f1e106]: Long Time Horizon
        - generic [ref=f1e107]: We are not building to flip. We are building to compound. Every decision is made through the lens of what the business looks like in ten years.
