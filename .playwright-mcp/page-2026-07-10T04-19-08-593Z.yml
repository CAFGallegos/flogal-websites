    - generic [ref=f35e33]:
      - generic [ref=f35e34]: Why direct
      - heading "Three things every shipper actually wants from a carrier." [level=2] [ref=f35e35]
      - paragraph [ref=f35e36]: Most freight today rides on margins, not on trucks. Flogal Carriers runs the opposite model — owned fleets, vetted partners, and the shortest possible distance between you and the driver.
    - generic [ref=f35e37]:
      - generic [ref=f35e38]:
        - heading "Direct capacity" [level=3] [ref=f35e43]
        - paragraph [ref=f35e44]: Your freight rides on Flogal-operated equipment or vetted partner fleets we dispatch ourselves. No load posting boards, no double-brokered surprises.
      - generic [ref=f35e45]:
        - heading "Vetted partners" [level=3] [ref=f35e50]
        - paragraph [ref=f35e51]: "Every partner fleet passes a 22-point compliance check: DOT authority, insurance verification, equipment age, and driver tenure. Re-checked quarterly."
      - generic [ref=f35e52]:
        - heading "No brokers" [level=3] [ref=f35e58]
        - paragraph [ref=f35e59]: One contract, one truck, one accountability chain. You talk to the operator dispatching your load — not a sales desk passing it down the chain for a margin.
  - generic [ref=f35e61]:
    - generic [ref=f35e62]:
