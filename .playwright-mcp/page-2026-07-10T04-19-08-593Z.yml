        - generic [ref=f35e210]: "01"
        - heading "Quote" [level=4] [ref=f35e211]
        - paragraph [ref=f35e212]: Share lane, equipment, weight, and pickup window — our ops desk quotes it directly, no broker markup.
      - generic [ref=f35e213]:
        - generic [ref=f35e214]: "02"
        - heading "Dispatch" [level=4] [ref=f35e215]
        - paragraph [ref=f35e216]: We assign owned equipment or a vetted partner fleet and you get the driver and truck before pickup.
