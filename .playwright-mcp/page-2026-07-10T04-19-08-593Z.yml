      - generic [ref=f35e205]: How we operate
      - heading "From RFP to POD on a single accountability chain." [level=2] [ref=f35e206]
      - paragraph [ref=f35e207]: One operator, one ops desk, four steps. The whole load lives on a single transaction — no second-tier brokers, no double-dispatched confusion, no calls about who actually has your trailer.
    - generic [ref=f35e208]:
