        - heading "What is Flogal Properties?" [level=3] [ref=f53e83]
        - paragraph [ref=f53e84]: Flogal Properties is the industrial real estate arm of Flogal, acquiring freight-oriented property — yards, terminals, and truck-ready sites — on active freight corridors.
      - generic [ref=f53e85]:
        - heading "Does Flogal Properties buy property directly?" [level=3] [ref=f53e86]
        - paragraph [ref=f53e87]: Yes. Flogal Properties is an operator-funded direct buyer of freight-oriented industrial real estate, including off-market sites.
      - generic [ref=f53e88]:
        - heading "What kind of property does Flogal Properties look for?" [level=3] [ref=f53e89]
        - paragraph [ref=f53e90]: Drop yards, terminals, truck parking, and industrial land that supports freight operations, primarily in Oklahoma and Texas freight corridors.
