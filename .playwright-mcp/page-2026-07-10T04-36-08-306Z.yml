        - generic [ref=f43e224]: "01"
        - heading "Quote" [level=4] [ref=f43e225]
        - paragraph [ref=f43e226]: Share lane, equipment, weight, and pickup window — our ops desk quotes it directly, no broker markup.
      - generic [ref=f43e227]:
        - generic [ref=f43e228]: "02"
        - heading "Dispatch" [level=4] [ref=f43e229]
        - paragraph [ref=f43e230]: We assign owned equipment or a vetted partner fleet and you get the driver and truck before pickup.
      - generic [ref=f43e231]:
        - generic [ref=f43e232]: "03"
        - heading "Track + POD" [level=4] [ref=f43e233]
        - paragraph [ref=f43e234]: GPS tracking and signed PODs delivered electronically — one ops contact end to end.
