    - generic [ref=f5e58]:
      - generic [ref=f5e59]:
        - heading "Who does aggregate hauling in Oklahoma?" [level=3] [ref=f5e60]
        - paragraph [ref=f5e61]: Flogal Carriers hauls aggregate across Oklahoma and Texas through its owned fleet RRTL, running end-dump and belly-dump trailers out of regional quarries.
      - generic [ref=f5e62]:
        - heading "What is end dump hauling?" [level=3] [ref=f5e63]
        - paragraph [ref=f5e64]: End dump hauling moves loose bulk material — rock, sand, gravel — in trailers that unload by raising the bed. It's the standard method for quarry and jobsite aggregate delivery.
      - generic [ref=f5e65]:
        - heading "Do you handle recurring quarry runs?" [level=3] [ref=f5e66]
        - paragraph [ref=f5e67]: Yes. Daily quarry freight is the core of the operation — recurring lanes are what our dispatch desk is built around.
