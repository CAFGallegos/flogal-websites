  - generic [ref=f7e56]:
    - generic [ref=f7e57]: Why an operator buys differently
    - heading "We site property against freight reality, not listing photos." [level=2] [ref=f7e58]
    - paragraph [ref=f7e59]: Our own dispatch desk knows which corridors have carrier density, fuel access, and driver depth — because our trucks run them. When we buy a yard, it's because freight already moves there.
  - generic [ref=f7e61]:
    - generic [ref=f7e62]:
      - generic [ref=f7e63]: How we operate
      - heading "Industrial real estate, run like an operating company." [level=2] [ref=f7e64]
    - generic [ref=f7e65]:
      - generic [ref=f7e66]:
        - text: "01"
        - heading "Lane density model" [level=4] [ref=f7e67]
        - paragraph [ref=f7e68]: We evaluate every site against carrier lane data — where freight already moves, not where the parcel happened to come up.
      - generic [ref=f7e69]:
        - text: "02"
        - heading "Site & spec" [level=4] [ref=f7e70]
        - paragraph [ref=f7e71]: "We buy and improve to a freight-grade spec: hardened surfaces, security, fuel access."
      - generic [ref=f7e72]:
        - text: "03"
        - heading "Lease or share" [level=4] [ref=f7e73]
        - paragraph [ref=f7e74]: Full-site leases for anchor tenants, or shared-yard arrangements for fleets that need stalls without an acquisition.
      - generic [ref=f7e75]:
        - text: "04"
        - heading "Ops handoff" [level=4] [ref=f7e76]
        - paragraph [ref=f7e77]: Sites plug into the Flogal carrier network from day one — fuel, drivers, and dispatch in the corridor.
  - generic [ref=f7e79]:
