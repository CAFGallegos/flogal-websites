  - generic [ref=f22e80]:
    - text: Flogal Technologies
    - heading "Run like one company, not five." [level=2] [ref=f22e81]
    - paragraph [ref=f22e82]: Every Flogal company runs on the same internal operating system — Flogal Technologies. Maintenance, driver tickets, payroll, and per-truck profitability live in one platform we built and operate ourselves. That means every truck's real cost is visible, every load is auditable, and a new company can plug into working systems on day one — not rebuild them. It's not a product we sell; it's how we keep freight companies disciplined, auditable, and ready to scale.
  - generic [ref=f22e84]:
    - text: Growth Model
    - heading "We build, partner, and acquire." [level=2] [ref=f22e85]
    - paragraph [ref=f22e86]: "Flogal grows three ways: building freight companies from the ground up, partnering with operators who want real infrastructure behind them, and acquiring businesses and assets that fit the platform. Operating companies plug into shared maintenance, dispatch, payroll, and per-truck P&L from day one — keeping what makes them work and gaining what they lacked."
    - generic [ref=f22e87]:
      - generic [ref=f22e88]:
        - generic [ref=f22e89]: Build
        - generic [ref=f22e90]: We start freight-native companies on infrastructure that already runs — not from a blank page.
      - generic [ref=f22e91]:
        - generic [ref=f22e92]: Partner
        - generic [ref=f22e93]: Operators keep their identity and customers; the platform carries the back office.
      - generic [ref=f22e94]:
        - generic [ref=f22e95]: Acquire
        - generic [ref=f22e96]: If you're selling a fleet, freight business, or freight-oriented asset, we're a direct, structured counterparty with the ability to close.
    - link "Start a Conversation →" [ref=f22e97] [cursor=pointer]:
      - /url: "#contact"
  - generic [ref=f22e99]:
    - text: FAQ
    - heading "Common questions." [level=2] [ref=f22e100]
    - generic [ref=f22e101]:
      - generic [ref=f22e102]:
        - heading "What is Flogal?" [level=3] [ref=f22e103]
        - paragraph [ref=f22e104]: Flogal is an operator-funded freight platform. It builds and operates a group of freight-native companies — hauling, equipment sales and leasing, and industrial real estate — on a shared operating system.
      - generic [ref=f22e105]:
        - heading "Is Flogal a carrier or a broker?" [level=3] [ref=f22e106]
        - paragraph [ref=f22e107]: Flogal operates asset-based carriers through J&D Hauling and RRTL. It is not a freight broker.
      - generic [ref=f22e108]:
        - heading "Where does Flogal operate?" [level=3] [ref=f22e109]
        - paragraph [ref=f22e110]: Flogal's freight operations run primarily on the Oklahoma–Texas corridor. The team also brings nationwide over-the-road and US–Mexico cross-border freight experience.
      - generic [ref=f22e111]:
        - heading "What is Flogal Technologies?" [level=3] [ref=f22e112]
        - paragraph [ref=f22e113]: Flogal Technologies is Flogal's internal operating system for maintenance, dispatch, payroll, and per-truck P&L. It runs Flogal's own companies; it is not sold as software.
      - generic [ref=f22e114]:
        - heading "Does Flogal acquire companies?" [level=3] [ref=f22e115]
        - paragraph [ref=f22e116]: Yes. Flogal partners with and acquires freight businesses, fleets, and freight-oriented assets that fit its platform. Sellers and operators can reach out through the contact form.
