  - generic [ref=f21e56]:
    - generic [ref=f21e57]: Why an operator buys differently
    - heading "We site property against freight reality, not listing photos." [level=2] [ref=f21e58]
    - paragraph [ref=f21e59]: Our own dispatch desk knows which corridors have carrier density, fuel access, and driver depth — because our trucks run them. When we buy a yard, it's because freight already moves there.
  - generic [ref=f21e61]:
    - generic [ref=f21e62]:
      - generic [ref=f21e63]: How we operate
      - heading "Industrial real estate, run like an operating company." [level=2] [ref=f21e64]
    - generic [ref=f21e65]:
      - generic [ref=f21e66]:
        - text: "01"
        - heading "Lane density model" [level=4] [ref=f21e67]
        - paragraph [ref=f21e68]: We evaluate every site against carrier lane data — where freight already moves, not where the parcel happened to come up.
      - generic [ref=f21e69]:
        - text: "02"
        - heading "Site & spec" [level=4] [ref=f21e70]
        - paragraph [ref=f21e71]: "We buy and improve to a freight-grade spec: hardened surfaces, security, fuel access."
      - generic [ref=f21e72]:
        - text: "03"
        - heading "Lease or share" [level=4] [ref=f21e73]
        - paragraph [ref=f21e74]: Full-site leases for anchor tenants, or shared-yard arrangements for fleets that need stalls without an acquisition.
      - generic [ref=f21e75]:
        - text: "04"
        - heading "Ops handoff" [level=4] [ref=f21e76]
        - paragraph [ref=f21e77]: Sites plug into the Flogal carrier network from day one — fuel, drivers, and dispatch in the corridor.
  - generic [ref=f21e79]:
