    - generic [ref=f28e44]:
      - generic [ref=f28e45]:
        - heading "Who does aggregate hauling in Oklahoma?" [level=3] [ref=f28e46]
        - paragraph [ref=f28e47]: Flogal Carriers hauls aggregate across Oklahoma and Texas through its owned fleet RRTL, running end-dump and belly-dump trailers out of regional quarries.
      - generic [ref=f28e48]:
        - heading "What is end dump hauling?" [level=3] [ref=f28e49]
        - paragraph [ref=f28e50]: End dump hauling moves loose bulk material — rock, sand, gravel — in trailers that unload by raising the bed. It's the standard method for quarry and jobsite aggregate delivery.
      - generic [ref=f28e51]:
        - heading "Do you handle recurring quarry runs?" [level=3] [ref=f28e52]
        - paragraph [ref=f28e53]: Yes. Daily quarry freight is the core of the operation — recurring lanes are what our dispatch desk is built around.
