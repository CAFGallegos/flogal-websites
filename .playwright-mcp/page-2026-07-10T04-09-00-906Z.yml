        - paragraph [ref=f23e86]: An acquired Flogal carrier handling freight hauling and equipment transport on regional corridors, dispatched alongside RRTL from the same ops desk.
      - article [ref=f23e87]:
        - generic [ref=f23e88]:
          - generic [ref=f23e89]: RRTL
          - heading "RRTL" [level=3] [ref=f23e91]
        - paragraph [ref=f23e92]: "End-dump and aggregate hauling: rock, sand, and base material out of regional quarries across the Texas–Oklahoma corridor. Day-in, day-out quarry freight is the core of what we do."
