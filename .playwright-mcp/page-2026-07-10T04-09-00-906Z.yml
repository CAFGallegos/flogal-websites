  - generic [ref=f23e217]:
    - generic [ref=f23e218]:
      - generic [ref=f23e219]: How we operate
      - heading "From RFP to POD on a single accountability chain." [level=2] [ref=f23e220]
      - paragraph [ref=f23e221]: One operator, one ops desk, four steps. The whole load lives on a single transaction — no second-tier brokers, no double-dispatched confusion, no calls about who actually has your trailer.
    - generic [ref=f23e222]:
      - generic [ref=f23e223]:
        - generic [ref=f23e224]: "01"
        - heading "Quote" [level=4] [ref=f23e225]
        - paragraph [ref=f23e226]: Share lane, equipment, weight, and pickup window — our ops desk quotes it directly, no broker markup.
      - generic [ref=f23e227]:
        - generic [ref=f23e228]: "02"
        - heading "Dispatch" [level=4] [ref=f23e229]
        - paragraph [ref=f23e230]: We assign owned equipment or a vetted partner fleet and you get the driver and truck before pickup.
      - generic [ref=f23e231]:
        - generic [ref=f23e232]: "03"
        - heading "Track + POD" [level=4] [ref=f23e233]
        - paragraph [ref=f23e234]: GPS tracking and signed PODs delivered electronically — one ops contact end to end.
