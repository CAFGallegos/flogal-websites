    - generic [ref=f18e58]:
      - generic [ref=f18e59]:
        - heading "Who does aggregate hauling in Oklahoma?" [level=3] [ref=f18e60]
        - paragraph [ref=f18e61]: Flogal Carriers hauls aggregate across Oklahoma and Texas through its owned fleet RRTL, running end-dump and belly-dump trailers out of regional quarries.
      - generic [ref=f18e62]:
        - heading "What is end dump hauling?" [level=3] [ref=f18e63]
        - paragraph [ref=f18e64]: End dump hauling moves loose bulk material — rock, sand, gravel — in trailers that unload by raising the bed. It's the standard method for quarry and jobsite aggregate delivery.
      - generic [ref=f18e65]:
        - heading "Do you handle recurring quarry runs?" [level=3] [ref=f18e66]
        - paragraph [ref=f18e67]: Yes. Daily quarry freight is the core of the operation — recurring lanes are what our dispatch desk is built around.
