    - generic [ref=f24e50]: Why an operator buys differently
    - heading "We site property against freight reality, not listing photos." [level=2] [ref=f24e51]
    - paragraph [ref=f24e52]: Our own dispatch desk knows which corridors have carrier density, fuel access, and driver depth — because our trucks run them. When we buy a yard, it's because freight already moves there.
