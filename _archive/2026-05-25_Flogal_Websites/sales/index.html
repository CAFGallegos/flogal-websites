<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FLOGAL Equipment · Sales — Inventory</title>
<link rel="stylesheet" href="https://www.flogalhq.com/css/brand.css">
<style>
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{font-family:var(--font-sans);background:var(--paper);color:var(--fg);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh;}

/* NAV */
.s-nav{
  background:var(--night-0);
  border-bottom:3px solid var(--flogal-gold);
  padding:0 32px;height:64px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;flex-shrink:0;
}
.s-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:white;}
.s-mark{height:24px;width:auto;}
.s-wordmark-wrap{display:flex;flex-direction:column;gap:1px;}
.s-wordmark{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:0.04em;color:white;line-height:1;}
.s-wordmark-sub{font-size:9px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:var(--flogal-gold);}
.s-nav-links{display:flex;gap:24px;list-style:none;margin:0;padding:0;}
.s-nav-links a{font-size:13px;font-weight:500;color:rgba(255,255,255,0.7);text-decoration:none;transition:color 140ms;}
.s-nav-links a:hover{color:white;}
.s-nav-cta{
  background:var(--flogal-gold);color:var(--flogal-navy);
  border:none;padding:9px 18px;border-radius:6px;
  font-family:var(--font-sans);font-size:13px;font-weight:700;
  cursor:pointer;text-decoration:none;white-space:nowrap;
  transition:background 140ms;display:inline-flex;align-items:center;gap:6px;
}
.s-nav-cta:hover{background:#d6a83a;}

/* LAYOUT */
.s-body{display:flex;flex:1;overflow:hidden;}

/* SIDEBAR */
.s-sidebar{
  width:280px;flex-shrink:0;
  border-right:1px solid var(--hairline);
  background:white;
  overflow-y:auto;
  padding:24px 20px;
}
.s-sidebar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.s-sidebar-title{font-size:12px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--fg);}
.s-sidebar-reset{font-size:12px;font-weight:600;color:var(--flogal-blue);background:none;border:none;cursor:pointer;padding:0;}
.s-sidebar-reset:hover{text-decoration:underline;}

.s-filter-group{margin-bottom:24px;}
.s-filter-label{font-size:13px;font-weight:700;color:var(--fg);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
.s-filter-label button{background:none;border:none;cursor:pointer;color:var(--fg-muted);font-size:16px;line-height:1;}
.s-filter-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.s-filter-check{display:flex;align-items:center;gap:8px;cursor:pointer;}
.s-filter-check input{width:14px;height:14px;accent-color:var(--flogal-blue);cursor:pointer;}
.s-filter-check span{font-size:13px;color:var(--fg);}
.s-filter-count{font-size:12px;color:var(--fg-muted);font-variant-numeric:tabular-nums;}
.s-range-row{display:flex;align-items:center;gap:8px;}
.s-range-input{
  flex:1;border:1px solid var(--hairline);border-radius:4px;
  padding:6px 10px;font-size:13px;font-family:var(--font-sans);
  color:var(--fg);outline:none;
  transition:border-color 140ms;
}
.s-range-input:focus{border-color:var(--flogal-blue);}
.s-range-sep{font-size:12px;color:var(--fg-muted);}

/* MAIN */
.s-main{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.s-main-head{
  padding:16px 24px;
  border-bottom:1px solid var(--hairline);
  display:flex;align-items:center;justify-content:space-between;
  background:white;position:sticky;top:0;z-index:10;
}
.s-count{font-size:15px;font-weight:700;color:var(--fg);}
.s-count span{color:var(--fg-muted);font-weight:400;font-size:13px;margin-left:6px;}
.s-head-right{display:flex;align-items:center;gap:16px;}
.s-sort{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg-muted);}
.s-sort select{
  border:1px solid var(--hairline);border-radius:4px;
  padding:6px 28px 6px 10px;font-size:13px;font-family:var(--font-sans);
  color:var(--fg);background:white;cursor:pointer;outline:none;
}
.s-view-btns{display:flex;gap:2px;}
.s-view-btn{
  width:32px;height:32px;border:1px solid var(--hairline);
  background:white;cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--fg-muted);transition:all 140ms;
}
.s-view-btn:first-child{border-radius:4px 0 0 4px;}
.s-view-btn:last-child{border-radius:0 4px 4px 0;}
.s-view-btn.active{background:var(--flogal-navy);color:white;border-color:var(--flogal-navy);}

.s-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--hairline);padding:1px;flex:1;}
.s-card{
  background:var(--night-1);cursor:pointer;
  transition:opacity 140ms;position:relative;
}
.s-card:hover{opacity:0.88;}
.s-card.active{outline:2px solid var(--flogal-gold);}
.s-card-img{
  aspect-ratio:16/9;background:var(--night-0);
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.s-card-img svg{opacity:0.18;}
.s-card-badges{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;}
.s-badge-id{font-family:var(--font-mono);font-size:11px;color:rgba(255,255,255,0.5);letter-spacing:0.06em;}
.s-badge-status{
  font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;
  padding:3px 8px;border-radius:4px;
}
.s-badge-INSPECTED{background:#165E3A;color:white;}
.s-badge-FRESH{background:var(--flogal-gold);color:var(--flogal-navy);}
.s-card-body{padding:16px 16px 18px;}
.s-card-meta{font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--flogal-gold);margin-bottom:4px;}
.s-card-model{font-family:var(--font-display);font-weight:700;font-size:20px;color:white;line-height:1.1;margin-bottom:6px;}
.s-card-specs{font-size:12px;color:rgba(255,255,255,0.45);margin-bottom:14px;}
.s-card-price{font-family:var(--font-display);font-variant-numeric:tabular-nums;font-weight:700;font-size:22px;color:white;margin-bottom:2px;}
.s-card-monthly{font-size:11px;color:rgba(255,255,255,0.4);}

/* DETAIL PANEL */
.s-detail{
  width:340px;flex-shrink:0;
  border-left:1px solid var(--hairline);
  background:white;
  overflow-y:auto;
  display:none;
}
.s-detail.open{display:flex;flex-direction:column;}
.s-detail-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 18px;border-bottom:1px solid var(--hairline);
  position:sticky;top:0;background:white;z-index:5;
}
.s-detail-id{font-family:var(--font-mono);font-size:12px;color:var(--fg-muted);letter-spacing:0.06em;}
.s-detail-close{
  background:none;border:none;cursor:pointer;
  color:var(--fg-muted);font-size:18px;line-height:1;padding:4px;
}
.s-detail-close:hover{color:var(--fg);}
.s-detail-gallery{
  aspect-ratio:16/9;background:var(--night-0);
  display:flex;align-items:center;justify-content:center;position:relative;
}
.s-detail-gallery svg{opacity:0.14;}
.s-gallery-meta{
  position:absolute;bottom:10px;left:12px;
  font-size:11px;color:rgba(255,255,255,0.55);
}
.s-detail-body{padding:20px 18px;}
.s-detail-year-make{font-size:11px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--flogal-gold);margin-bottom:6px;}
.s-detail-model{font-family:var(--font-display);font-weight:700;font-size:28px;letter-spacing:-0.01em;color:var(--flogal-navy);line-height:1.1;margin-bottom:16px;}
.s-detail-price{font-family:var(--font-display);font-variant-numeric:tabular-nums;font-weight:700;font-size:30px;color:var(--flogal-navy);margin-bottom:2px;}
.s-detail-monthly{font-size:12px;color:var(--fg-muted);margin-bottom:20px;}
.s-detail-actions{display:flex;gap:8px;margin-bottom:24px;}
.s-btn-primary{
  flex:1;background:var(--flogal-gold);color:var(--flogal-navy);
  border:none;padding:10px;border-radius:6px;
  font-family:var(--font-sans);font-size:13px;font-weight:700;
  cursor:pointer;transition:background 140ms;
}
.s-btn-primary:hover{background:#d6a83a;}
.s-btn-secondary{
  flex:1;background:white;color:var(--flogal-navy);
  border:1px solid var(--hairline);padding:10px;border-radius:6px;
  font-family:var(--font-sans);font-size:13px;font-weight:600;
  cursor:pointer;transition:border-color 140ms;
}
.s-btn-secondary:hover{border-color:var(--flogal-navy);}

.s-section-label{font-size:10px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:var(--fg-muted);margin-bottom:10px;}
.s-financing{border:1px solid var(--hairline);border-radius:8px;overflow:hidden;margin-bottom:24px;}
.s-fin-row{display:flex;justify-content:space-between;padding:10px 14px;font-size:13px;border-bottom:1px solid var(--hairline);}
.s-fin-row:last-child{border-bottom:none;}
.s-fin-row span:last-child{font-weight:700;font-variant-numeric:tabular-nums;}
.s-fin-note{font-size:11px;color:var(--fg-muted);line-height:1.5;padding:10px 14px;background:var(--surface-1);border-top:1px solid var(--hairline);}

.s-specs{border:1px solid var(--hairline);border-radius:8px;overflow:hidden;margin-bottom:24px;}
.s-spec-row{display:flex;justify-content:space-between;padding:9px 14px;font-size:12px;border-bottom:1px solid var(--hairline);}
.s-spec-row:last-child{border-bottom:none;}
.s-spec-key{color:var(--fg-muted);}
.s-spec-val{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;max-width:180px;}
.s-spec-val.mono{font-family:var(--font-mono);font-size:11px;}
</style>
</head>
<body>

<header class="s-nav">
  <a class="s-brand" href="https://www.flogalhq.com">
    <img class="s-mark" src="https://www.flogalhq.com/logos/flogal-symbol-white.png" alt="">
    <div class="s-wordmark-wrap">
      <span class="s-wordmark">FLOGAL</span>
      <span class="s-wordmark-sub">Equipment · Sales</span>
    </div>
  </a>
  <ul class="s-nav-links">
    <li><a href="https://www.flogalhq.com">Home</a></li>
    <li><a href="https://carriers.flogalhq.com">Carriers</a></li>
    <li><a href="https://properties.flogalhq.com">Properties</a></li>
    <li><a href="https://www.flogalhq.com/about">About</a></li>
  </ul>
  <a href="mailto:equipment@flogalhq.com" class="s-nav-cta">Request a quote →</a>
</header>

<div class="s-body">

  <!-- SIDEBAR FILTERS -->
  <aside class="s-sidebar">
    <div class="s-sidebar-head">
      <span class="s-sidebar-title">Filters</span>
      <button class="s-sidebar-reset" onclick="resetFilters()">Reset</button>
    </div>

    <div class="s-filter-group">
      <div class="s-filter-label">Equipment type <button onclick="this.closest('.s-filter-group').querySelector('.s-filter-opts').style.display=this.closest('.s-filter-group').querySelector('.s-filter-opts').style.display==='none'?'block':'none'">−</button></div>
      <div class="s-filter-opts">
        <div class="s-filter-row"><label class="s-filter-check"><input type="checkbox" name="type" value="Tractor - day cab" onchange="applyFilters()"><span>Tractor - day cab</span></label><span class="s-filter-count" id="cnt-day-cab">—</span></div>
        <div class="s-filter-row"><label class="s-filter-check"><input type="checkbox" name="type" value="Tractor - sleeper" onchange="applyFilters()"><span>Tractor - sleeper</span></label><span class="s-filter-count" id="cnt-sleeper">—</span></div>
        <div class="s-filter-row"><label class="s-filter-check"><input type="checkbox" name="type" value="Dry van trailer" onchange="applyFilters()"><span>Dry van trailer</span></label><span class="s-filter-count" id="cnt-dry-van">—</span></div>
        <div class="s-filter-row"><label class="s-filter-check"><input type="checkbox" name="type" value="Reefer trailer" onchange="applyFilters()"><span>Reefer trailer</span></label><span class="s-filter-count" id="cnt-reefer">—</span></div>
        <div class="s-filter-row"><label class="s-filter-check"><input type="checkbox" name="type" value="Flatbed" onchange="applyFilters()"><span>Flatbed</span></label><span class="s-filter-count" id="cnt-flatbed">—</span></div>
      </div>
    </div>

    <div class="s-filter-group">
      <div class="s-filter-label">Year</div>
      <div class="s-range-row">
        <input class="s-range-input" type="number" id="year-min" placeholder="2018" min="2000" max="2026" onchange="applyFilters()">
        <span class="s-range-sep">—</span>
        <input class="s-range-input" type="number" id="year-max" placeholder="2024" min="2000" max="2026" onchange="applyFilters()">
      </div>
    </div>

    <div class="s-filter-group">
      <div class="s-filter-label">Price</div>
      <div class="s-range-row">
        <input class="s-range-input" type="number" id="price-min" placeholder="$20,000" onchange="applyFilters()">
        <span class="s-range-sep">—</span>
        <input class="s-range-input" type="number" id="price-max" placeholder="$120,000" onchange="applyFilters()">
      </div>
      <label class="s-filter-check" style="margin-top:10px"><input type="checkbox" id="lease-eligible" onchange="applyFilters()"><span style="font-size:13px">Lease eligible</span></label>
    </div>

    <div class="s-filter-group">
      <div class="s-filter-label">Make</div>
      <div class="s-filter-opts" id="make-filters"></div>
    </div>

    <div class="s-filter-group">
      <div class="s-filter-label">Condition</div>
      <div class="s-filter-row"><label class="s-filter-check"><input type="checkbox" name="status" value="INSPECTED" onchange="applyFilters()"><span>Inspected</span></label></div>
      <div class="s-filter-row"><label class="s-filter-check"><input type="checkbox" name="status" value="FRESH" onchange="applyFilters()"><span>Fresh</span></label></div>
    </div>
  </aside>

  <!-- INVENTORY MAIN -->
  <main class="s-main" id="inventory">
    <div class="s-main-head">
      <div class="s-count" id="count-label">Loading...</div>
      <div class="s-head-right">
        <div class="s-sort">
          Sort
          <select id="sort-select" onchange="applyFilters()">
            <option value="recent">Recently added</option>
            <option value="price-asc">Price: Low to high</option>
            <option value="price-desc">Price: High to low</option>
            <option value="year-desc">Year: Newest</option>
            <option value="miles-asc">Miles: Lowest</option>
          </select>
        </div>
        <div class="s-view-btns">
          <button class="s-view-btn active" title="Grid view">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg>
          </button>
          <button class="s-view-btn" title="List view">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="s-grid" id="inventory-grid"></div>
  </main>

  <!-- DETAIL PANEL -->
  <aside class="s-detail" id="detail-panel">
    <div class="s-detail-head">
      <span class="s-detail-id" id="d-id"></span>
      <button class="s-detail-close" onclick="closeDetail()">✕</button>
    </div>
    <div class="s-detail-gallery">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      <div class="s-gallery-meta" id="d-gallery-meta"></div>
    </div>
    <div class="s-detail-body">
      <div class="s-detail-year-make" id="d-year-make"></div>
      <div class="s-detail-model" id="d-model"></div>
      <div class="s-detail-price" id="d-price"></div>
      <div class="s-detail-monthly" id="d-monthly"></div>
      <div class="s-detail-actions">
        <button class="s-btn-primary" onclick="requestQuote()">Request quote</button>
        <button class="s-btn-secondary">Schedule walk-around</button>
      </div>

      <div class="s-section-label">Financing</div>
      <div class="s-financing">
        <div id="d-financing-rows"></div>
        <div class="s-fin-note">Through Flogal Capital · Tier-1 credit assumed · Rates as of <span id="d-rate-date"></span></div>
      </div>

      <div class="s-section-label">Specifications</div>
      <div class="s-specs" id="d-specs"></div>
    </div>
  </aside>

</div>

<script>
let allListings = [];
let activeId = null;

async function loadInventory() {
  try {
    const res = await fetch('inventory.json');
    const data = await res.json();
    allListings = data.listings;
    document.getElementById('count-label').innerHTML = 
      `<span style="font-variant-numeric:tabular-nums">${allListings.length} units</span> <span>· ${data.yard}</span>`;
    buildMakeFilters();
    updateCounts();
    renderGrid(allListings);
    // Set today's date for financing note
    document.getElementById('d-rate-date').textContent = new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  } catch(e) {
    // Fallback if fetch fails (file:// protocol)
    document.getElementById('count-label').innerHTML = '<span style="color:var(--fg-muted);font-size:13px">Open via a local server or Vercel to load inventory</span>';
  }
}

function buildMakeFilters() {
  const makes = [...new Set(allListings.map(l => l.make))].sort();
  const counts = {};
  allListings.forEach(l => { counts[l.make] = (counts[l.make]||0)+1; });
  const el = document.getElementById('make-filters');
  el.innerHTML = makes.map(m => `
    <div class="s-filter-row">
      <label class="s-filter-check">
        <input type="checkbox" name="make" value="${m}" onchange="applyFilters()">
        <span>${m.charAt(0)+m.slice(1).toLowerCase()}</span>
      </label>
      <span class="s-filter-count">${counts[m]}</span>
    </div>`).join('');
}

function updateCounts() {
  const typeCounts = {};
  allListings.forEach(l => { typeCounts[l.type] = (typeCounts[l.type]||0)+1; });
  const map = {
    'cnt-day-cab':'Tractor - day cab','cnt-sleeper':'Tractor - sleeper',
    'cnt-dry-van':'Dry van trailer','cnt-reefer':'Reefer trailer','cnt-flatbed':'Flatbed'
  };
  Object.entries(map).forEach(([id,type]) => {
    const el = document.getElementById(id);
    if(el) el.textContent = typeCounts[type]||0;
  });
}

function getFilters() {
  const types = [...document.querySelectorAll('[name="type"]:checked')].map(e=>e.value);
  const makes = [...document.querySelectorAll('[name="make"]:checked')].map(e=>e.value);
  const statuses = [...document.querySelectorAll('[name="status"]:checked')].map(e=>e.value);
  const yearMin = parseInt(document.getElementById('year-min').value)||0;
  const yearMax = parseInt(document.getElementById('year-max').value)||9999;
  const priceMin = parseInt(document.getElementById('price-min').value)||0;
  const priceMax = parseInt(document.getElementById('price-max').value)||99999999;
  return {types,makes,statuses,yearMin,yearMax,priceMin,priceMax};
}

function applyFilters() {
  const f = getFilters();
  const sort = document.getElementById('sort-select').value;
  let filtered = allListings.filter(l => {
    if(f.types.length && !f.types.includes(l.type)) return false;
    if(f.makes.length && !f.makes.includes(l.make)) return false;
    if(f.statuses.length && !f.statuses.includes(l.status)) return false;
    if(l.year < f.yearMin || l.year > f.yearMax) return false;
    if(l.price < f.priceMin || l.price > f.priceMax) return false;
    return true;
  });
  if(sort==='price-asc') filtered.sort((a,b)=>a.price-b.price);
  if(sort==='price-desc') filtered.sort((a,b)=>b.price-a.price);
  if(sort==='year-desc') filtered.sort((a,b)=>b.year-a.year);
  if(sort==='miles-asc') filtered.sort((a,b)=>(a.mileage||0)-(b.mileage||0));
  renderGrid(filtered);
}

function resetFilters() {
  document.querySelectorAll('input[type="checkbox"]').forEach(e=>e.checked=false);
  document.getElementById('year-min').value='';
  document.getElementById('year-max').value='';
  document.getElementById('price-min').value='';
  document.getElementById('price-max').value='';
  renderGrid(allListings);
}

function fmt(n){ return n ? '$'+n.toLocaleString() : '—'; }
function fmtMi(n){ return n ? n.toLocaleString()+' mi' : '—'; }

function renderGrid(listings) {
  const grid = document.getElementById('inventory-grid');
  grid.innerHTML = listings.map(l => `
    <div class="s-card${l.id===activeId?' active':''}" onclick="openDetail('${l.id}')">
      <div class="s-card-img">
        <svg width="48" height="48" viewBox="0 0 64 64" fill="none" stroke="white" stroke-width="1.5">
          <path d="M4 42 L4 32 L20 16 L52 16 L60 24 L60 42 Z"/>
          <circle cx="16" cy="48" r="8"/><circle cx="48" cy="48" r="8"/>
          <line x1="4" y1="28" x2="60" y2="28"/>
        </svg>
        <div class="s-card-badges">
          <span class="s-badge-id">${l.id}</span>
          <span class="s-badge-status s-badge-${l.status}">${l.status}</span>
        </div>
      </div>
      <div class="s-card-body">
        <div class="s-card-meta">${l.year} · ${l.make}</div>
        <div class="s-card-model">${l.model}</div>
        <div class="s-card-specs">${[l.engine, l.mileage?fmtMi(l.mileage):null, l.transmission].filter(Boolean).join(' · ')}</div>
        <div class="s-card-price">${fmt(l.price)}</div>
        <div class="s-card-monthly">or ${fmt(l.monthly)}/mo · ${l.term}mo · OAC</div>
      </div>
    </div>`).join('');
}

function openDetail(id) {
  activeId = id;
  const l = allListings.find(x=>x.id===id);
  if(!l) return;

  // Highlight card
  document.querySelectorAll('.s-card').forEach(c=>c.classList.remove('active'));
  document.querySelectorAll('.s-card').forEach(c=>{
    if(c.getAttribute('onclick')===`openDetail('${id}')`) c.classList.add('active');
  });

  document.getElementById('d-id').textContent = l.id;
  document.getElementById('d-year-make').textContent = `${l.year} · ${l.make}`;
  document.getElementById('d-model').textContent = l.model;
  document.getElementById('d-price').textContent = `${fmt(l.price)}`;
  document.getElementById('d-monthly').textContent = `or ${fmt(l.monthly)}/mo · ${l.term}mo · OAC`;
  document.getElementById('d-gallery-meta').textContent = l.photos ? `${l.photos} photos${l.video?' · 1 video walkaround':''}` : '';

  // Financing
  document.getElementById('d-financing-rows').innerHTML = l.financing.map(f=>`
    <div class="s-fin-row"><span>${f.label}</span><span>${fmt(f.monthly)}/mo</span></div>`).join('');

  // Specs
  const specs = [
    ['VIN', `<span class="s-spec-val mono">${l.vin||'—'}</span>`],
    ['Year', l.year],
    ['Make / Model', `${l.make.charAt(0)+l.make.slice(1).toLowerCase()} ${l.model}`],
    ['Engine', l.engine||'—'],
    ['Transmission', l.transmission||'—'],
    ['Mileage', fmtMi(l.mileage)],
    ['Sleeper', l.sleeper||'—'],
    ['Axle config', l.axle||'—'],
  ];
  document.getElementById('d-specs').innerHTML = specs.map(([k,v])=>
    `<div class="s-spec-row"><span class="s-spec-key">${k}</span>${typeof v==='string'&&v.includes('class=')? v :`<span class="s-spec-val">${v}</span>`}</div>`
  ).join('');

  document.getElementById('detail-panel').classList.add('open');
}

function closeDetail() {
  activeId = null;
  document.getElementById('detail-panel').classList.remove('open');
  document.querySelectorAll('.s-card').forEach(c=>c.classList.remove('active'));
}

function requestQuote() {
  const l = allListings.find(x=>x.id===activeId);
  if(l) window.location.href = `mailto:equipment@flogalhq.com?subject=Quote Request: ${l.id} ${l.year} ${l.make} ${l.model}&body=Unit ID: ${l.id}%0AModel: ${l.year} ${l.make} ${l.model}%0AAsking: ${fmt(l.price)}%0A%0APlease send me more information about this unit.`;
}

loadInventory();
</script>
</body>
</html>
