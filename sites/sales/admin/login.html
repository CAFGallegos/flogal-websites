<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FLOGAL Sales Admin — Sign In</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="lg-page" data-screen-label="FLOGAL Sales Admin · Login">
    <div class="lg-card">
      <a class="lg-brand" href="../index.html">
        <img class="lg-brand-mark" src="../../../shared/logos/flogal-symbol-color.png" alt="">
        <span class="lg-brand-wm">FLOGAL</span>
        <span class="lg-brand-divider" aria-hidden="true"></span>
        <span class="lg-brand-division">Sales Admin</span>
      </a>

      <h1 class="lg-h">Inventory Portal</h1>
      <p class="lg-sub">Sign in to manage equipment listings, lease deals, and customer inquiries.</p>

      <form action="dashboard.html" method="get">
        <div class="lg-field">
          <label class="lg-lab" for="lg-email">Email</label>
          <input id="lg-email" name="email" type="email" class="lg-input" placeholder="you@flogalhq.com" autocomplete="username">
        </div>
        <div class="lg-field">
          <label class="lg-lab" for="lg-pass">Password</label>
          <input id="lg-pass" name="password" type="password" class="lg-input" placeholder="••••••••••••" autocomplete="current-password">
        </div>
        <div class="lg-actions">
          <button type="submit" class="ad-btn ad-btn-blue">Sign In →</button>
        </div>
      </form>

      <div class="lg-foot">
        Trouble signing in? <a href="mailto:it@flogalhq.com">Email IT</a>
      </div>
    </div>
  </div>
</body>
</html>
